name: Generate, build and deploy
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency: { group: "site-${{ github.ref }}", cancel-in-progress: false }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    environment: { name: production, url: "https://aiagentnewsfree.com" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Write new content
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional, paid
          AI_MODEL: ${{ vars.AI_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }} # optional, free: watermark-free AI pictures
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run generate
      # Build before committing: new content that breaks the build is never published or saved.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aiagentnewsfree.com' }}
      - name: Commit content
        if: github.event_name != 'push'
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "content: auto update $(date -u +%F) [skip ci]" && git push)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aiagentnewsfree --branch=main --commit-dirty=true
